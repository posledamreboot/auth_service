version: '3.8'

services:
  auth-service:
    build: .
    container_name: auth_service
    ports:
      - "8001:8000" 
    environment:
      - DATABASE_URL=postgresql://user:password@postgres_container:5432/poi_db
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - db_poi_network

networks:
  db_poi_network:
    external: true