version: '3.8'

services:
  auth-service:
    build: .
    container_name: auth_service
    ports:
      - "8001:8000" 
    environment:
      - DATABASE_URL=postgresql://user:password@postgres_container:5432/poi_db
      - SECRET_KEY=bdc91d44-b618-423e-b61c-fbe8ac8c491d
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_HOURS=24
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - db_poi_network

networks:
  db_poi_network:
    external: true